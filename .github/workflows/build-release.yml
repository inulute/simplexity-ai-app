name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

jobs:
  build:
    # No `contents: write` and no GH_TOKEN here on purpose: electron-builder
    # defaults `--publish` to "onTag" whenever a CI tag is present, and will
    # silently upload every artifact (plus .blockmap / latest*.yml) to the
    # release by itself if it can find a GitHub token. The `release` job below
    # is the only thing allowed to touch the release.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Signing variables are exported ONLY when the matching secret exists.
      # An unset secret expands to an empty string, and electron-builder treats
      # an empty CSC_LINK as a certificate *path* rather than as "no
      # certificate" -- on macOS that resolves to the repo root and fails the
      # build with "<repo> not a file". Windows tolerates it, macOS does not,
      # so the variables must be absent rather than empty.
      - name: Configure code signing
        id: signing
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            LINK="${{ secrets.MAC_CSC_LINK }}"
            PASS="${{ secrets.MAC_CSC_KEY_PASSWORD }}"
          elif [ "${{ matrix.platform }}" = "win" ]; then
            LINK="${{ secrets.WIN_CSC_LINK }}"
            PASS="${{ secrets.WIN_CSC_KEY_PASSWORD }}"
          else
            LINK=""; PASS=""
          fi

          if [ -n "$LINK" ]; then
            echo "CSC_LINK=$LINK" >> $GITHUB_ENV
            echo "CSC_KEY_PASSWORD=$PASS" >> $GITHUB_ENV
            echo "Signing certificate configured for ${{ matrix.platform }}."
          else
            # Without this electron-builder searches the keychain and warns.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV
            echo "No signing certificate for ${{ matrix.platform }}; building unsigned."
          fi

          if [ "${{ matrix.platform }}" = "mac" ] && [ -n "${{ secrets.APPLE_ID }}" ]; then
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV
            echo "Notarization credentials configured."
          fi
        shell: bash

      - name: Build for Windows
        if: matrix.platform == 'win'
        run: npm run package-win

      - name: Build for macOS
        if: matrix.platform == 'mac'
        run: npm run package-mac

      - name: Build for Linux
        if: matrix.platform == 'linux'
        run: npm run package-linux

      - name: Upload Windows artifacts
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v5
        with:
          name: windows-builds
          path: |
            release-builds/*.exe
          retention-days: 5

      - name: Upload macOS artifacts
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v5
        with:
          name: macos-builds
          path: |
            release-builds/*.dmg
          retention-days: 5

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v5
        with:
          name: linux-builds
          path: |
            release-builds/*.AppImage
            release-builds/*.deb
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      # Required by actions/attest-build-provenance (keyless Sigstore signing).
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist

      # Flatten every artifact into one directory so the release upload and the
      # attestation operate on exactly the same set of files. Fail loudly if it
      # is empty: attesting a glob that matches nothing fails the step later
      # with a far less obvious error.
      - name: Stage release files
        shell: bash
        run: |
          mkdir -p staged
          # Check for basename collisions first: a plain `mv` into one directory
          # would silently drop a same-named artifact from another platform.
          # Done before the move so `exit 1` runs in this shell, not a subshell.
          dupes=$(find dist -type f -exec basename {} \; | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate artifact names across platforms: $dupes"
            exit 1
          fi
          find dist -type f -exec mv {} staged/ \;
          ls -la staged
          if [ -z "$(ls -A staged)" ]; then
            echo "::error::No build artifacts were staged for the release"
            exit 1
          fi

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Read release notes
        id: notes
        run: |
          NOTES_FILE="release_notes/v${{ steps.version.outputs.VERSION }}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "NOTES_FILE=$NOTES_FILE" >> $GITHUB_OUTPUT
            echo "HAS_NOTES=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_NOTES=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release Draft
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: "Simplexity AI v${{ steps.version.outputs.VERSION }}"
          body_path: ${{ steps.notes.outputs.HAS_NOTES == 'true' && steps.notes.outputs.NOTES_FILE || '' }}
          generate_release_notes: ${{ steps.notes.outputs.HAS_NOTES != 'true' }}
          files: |
            staged/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Replaces the never-wired GPG signing hook that used to live in
      # build/after-pack.js. Keyless, no secrets to rotate; verify with
      #   gh attestation verify <file> --repo ${{ github.repository }}
      # Runs after the upload on purpose: the release is a draft, so nothing is
      # public until the owner publishes it, and a provenance hiccup should show
      # up as a red step rather than stranding the binaries. Attestations are
      # keyed on the file digest, so order does not affect their validity.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: staged/*
