<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update Available</title>
  <!-- Scripts are bundled locally, so nothing remote may be executed. The
       only network access this page needs is the release-notes fetch in
       src/js/renderer/update_renderer.js. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src https://raw.githubusercontent.com; form-action 'none'; base-uri 'none'">
  <link rel="stylesheet" href="./src/css/update.css">
  
  <!-- Bundled locally: loading these from a CDN breaks the dialog whenever the
       CDN is unreachable (offline / blocked / corporate proxy) and pulls a
       floating, unpinned version of marked into the renderer at runtime. -->
  <script src="./node_modules/marked/lib/marked.umd.js"></script>

  <script src="./node_modules/dompurify/dist/purify.min.js"></script>

</head>
<body>
    <div id="update-container">
      <button id="update-close-button">&#x2715;</button>
      <div class="update-header">
        <img src="./assets/icons/svg/simplexityai.svg" alt="App Icon" class="app-icon" width="auto" height="auto"><br>
        <h2>New Update Available (v<span id="latest-version"></span>)</h2>
      </div>

      <div class="release-notes">
        <h3>What's New:</h3>
        <div id="release-notes-content">
          <!-- Release notes will be rendered here -->
        </div>
      </div>
      
      <div class="button-container">
        <button id="remind-tomorrow-button">Remind Me Tomorrow</button>
        <button id="download-update-button">Download Update</button>
      </div>
    </div>

  <script src="./src/js/renderer/update_renderer.js"></script>
</body>
</html>
